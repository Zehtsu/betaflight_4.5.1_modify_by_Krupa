name: Build Betaflight 4.5.1 SPEDIXF405 DEBUG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip curl unzip

      - name: Install ARM toolchain
        run: |
          make arm_sdk_install

      - name: Download configs
        run: |
          make configs

      - name: Prepare SPEDIXF405 config
        run: |
          mkdir -p src/config/configs/SPEDIXF405
          cp -a src/config/configs/SPDX/SPEDIXF405/. \
                src/config/configs/SPEDIXF405/

      - name: Force SPI gyro support
        run: |
          CONFIG="src/config/configs/SPEDIXF405/config.h"

          echo "" >> "$CONFIG"
          echo "// Added for BF 4.5.1 compatibility" >> "$CONFIG"
          echo "#ifndef USE_SPI_GYRO" >> "$CONFIG"
          echo "#define USE_SPI_GYRO" >> "$CONFIG"
          echo "#endif" >> "$CONFIG"

      - name: Verify gyro configuration
        run: |
          CONFIG="src/config/configs/SPEDIXF405/config.h"

          echo "===== GYRO / SPI DEFINES ====="

          grep -E \
          "USE_SPI_GYRO|ICM42688P|GYRO_1|SPI1_" \
          "$CONFIG"

          echo "=============================="

          grep -q "USE_SPI_GYRO" "$CONFIG"
          grep -q "USE_GYRO_SPI_ICM42688P" "$CONFIG"
          grep -q "USE_ACC_SPI_ICM42688P" "$CONFIG"

          grep -q "SPI1_SCK_PIN PA5" "$CONFIG"
          grep -q "SPI1_SDI_PIN PA6" "$CONFIG"
          grep -q "SPI1_SDO_PIN PA7" "$CONFIG"

          grep -q "GYRO_1_CS_PIN PA4" "$CONFIG"
          grep -q "GYRO_1_EXTI_PIN PC4" "$CONFIG"
          grep -q "GYRO_1_SPI_INSTANCE SPI1" "$CONFIG"

          echo "SPEDIXF405 SPI1 + ICM42688P configuration OK"

      - name: Build SPEDIXF405
        run: |
          make CONFIG=SPEDIXF405

      - name: Find build outputs
        run: |
          echo "===== HEX/BIN/MAP ====="
          find . -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.map" \
          \) -print

      - name: Inspect map for SPI and gyro
        run: |
          echo "===== ICM42688P ====="
          grep -R -i "icm42688" obj/ || true

          echo "===== SPI INIT ====="
          grep -R -i "spiInit" obj/ || true

          echo "===== SPI BUS ====="
          grep -R -i "spiBus" obj/ || true

      - name: Collect diagnostic files
        run: |
          mkdir -p firmware

          find . -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.map" \
          \) \
          -not -path "./firmware/*" \
          -exec cp {} firmware/ \;

          echo "===== ARTIFACT ====="
          ls -lah firmware/

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: SPEDIXF405-4.5.1-SPI-GYRO-DEBUG
          path: firmware/
          if-no-files-found: error
