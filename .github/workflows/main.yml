name: Build Betaflight 4.5.1 SPEDIXF405

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Betaflight
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip curl unzip

      - name: Install ARM toolchain
        run: |
          make arm_sdk_install

      - name: Download Betaflight target configs
        run: |
          make configs

      - name: Find official SPEDIXF405 config
        run: |
          echo "===== OFFICIAL SPEDIXF405 CONFIG ====="

          CONFIG=$(find src/config/configs \
            -type f \
            -path "*/SPEDIXF405/config.h" \
            | head -n 1)

          echo "Found:"
          echo "$CONFIG"

          if [ -z "$CONFIG" ]; then
            echo "ERROR: SPEDIXF405 config.h NOT FOUND"
            exit 1
          fi

          echo ""
          echo "===== GYRO DEFINITIONS ====="

          grep -n -E \
          "ICM42688|GYRO_1|SPI1_" \
          "$CONFIG" || true

      - name: Prepare SPEDIXF405 config for Betaflight 4.5.1
        run: |
          echo "===== PREPARING CONFIG ====="

          SOURCE_CONFIG=$(find src/config/configs \
            -type d \
            -path "*/SPDX/SPEDIXF405" \
            | head -n 1)

          echo "Source:"
          echo "$SOURCE_CONFIG"

          if [ -z "$SOURCE_CONFIG" ]; then
            echo "ERROR: SPDX/SPEDIXF405 directory NOT FOUND"
            exit 1
          fi

          mkdir -p src/config/configs/SPEDIXF405

          cp -a "$SOURCE_CONFIG"/. \
            src/config/configs/SPEDIXF405/

          echo ""
          echo "===== COPIED CONFIG ====="
          ls -lah src/config/configs/SPEDIXF405/

      - name: Verify gyro configuration
        run: |
          echo "===== VERIFY SPEDIXF405 GYRO ====="

          CONFIG=src/config/configs/SPEDIXF405/config.h

          test -f "$CONFIG"

          grep -q "USE_GYRO_SPI_ICM42688P" "$CONFIG"
          grep -q "GYRO_1_CS_PIN PA4" "$CONFIG"
          grep -q "GYRO_1_SPI_INSTANCE SPI1" "$CONFIG"
          grep -q "SPI1_SCK_PIN PA5" "$CONFIG"
          grep -q "SPI1_SDI_PIN PA6" "$CONFIG"
          grep -q "SPI1_SDO_PIN PA7" "$CONFIG"

          echo "ICM42688P configuration OK"

      - name: Build SPEDIXF405
        run: |
          echo "===== BUILDING SPEDIXF405 ====="
          make CONFIG=SPEDIXF405

      - name: Find generated firmware
        run: |
          echo "===== GENERATED FIRMWARE ====="

          find obj \
            -type f \
            \( -name "*.hex" -o -name "*.bin" \) \
            -print || true

      - name: Collect firmware
        run: |
          mkdir -p firmware

          find obj \
            -type f \
            \( -name "*.hex" -o -name "*.bin" \) \
            -exec cp {} firmware/ \;

          echo ""
          echo "===== FIRMWARE DIRECTORY ====="
          ls -lah firmware/

          if ! find firmware -type f \( -name "*.hex" -o -name "*.bin" \) | grep -q .; then
            echo "ERROR: Firmware was not generated"
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Betaflight-4.5.1-SPEDIXF405-ICM42688P
          path: firmware/
          if-no-files-found: error
