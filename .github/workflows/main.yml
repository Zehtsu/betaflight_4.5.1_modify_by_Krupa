name: Build Betaflight 4.5.1 SPEDIXF405 SPI FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip curl unzip

      - name: Install ARM toolchain
        run: |
          make arm_sdk_install

      - name: Download configs
        run: |
          make configs

      # Betaflight 4.5.1 expects the old flat config path.
      - name: Prepare SPEDIXF405 config
        run: |
          mkdir -p src/config/configs/SPEDIXF405
          cp -a src/config/configs/SPDX/SPEDIXF405/. \
                src/config/configs/SPEDIXF405/

      # Compatibility definitions required by the BF 4.5.1 SPI/gyro code.
      - name: Force SPI1 and gyro support
        run: |
          CONFIG="src/config/configs/SPEDIXF405/config.h"

          echo "" >> "$CONFIG"
          echo "// Added for Betaflight 4.5.1 compatibility" >> "$CONFIG"

          echo "#ifndef USE_SPI_GYRO" >> "$CONFIG"
          echo "#define USE_SPI_GYRO" >> "$CONFIG"
          echo "#endif" >> "$CONFIG"

          echo "#ifndef USE_SPI_DEVICE_1" >> "$CONFIG"
          echo "#define USE_SPI_DEVICE_1" >> "$CONFIG"
          echo "#endif" >> "$CONFIG"

      # Verify all definitions required for the physical gyro.
      - name: Verify SPEDIXF405 SPI1 configuration
        run: |
          CONFIG="src/config/configs/SPEDIXF405/config.h"

          echo "========================================"
          echo " SPEDIXF405 GYRO / SPI CONFIGURATION"
          echo "========================================"

          grep -E \
          "USE_SPI_GYRO|USE_SPI_DEVICE_1|ICM42688P|GYRO_1|SPI1_" \
          "$CONFIG"

          echo "========================================"

          echo "Checking SPI gyro..."
          grep -q "USE_SPI_GYRO" "$CONFIG"

          echo "Checking SPI device 1..."
          grep -q "USE_SPI_DEVICE_1" "$CONFIG"

          echo "Checking ICM42688P gyro driver..."
          grep -q "USE_GYRO_SPI_ICM42688P" "$CONFIG"

          echo "Checking ICM42688P accelerometer driver..."
          grep -q "USE_ACC_SPI_ICM42688P" "$CONFIG"

          echo "Checking SPI1 SCK PA5..."
          grep -q "SPI1_SCK_PIN PA5" "$CONFIG"

          echo "Checking SPI1 MISO PA6..."
          grep -q "SPI1_SDI_PIN PA6" "$CONFIG"

          echo "Checking SPI1 MOSI PA7..."
          grep -q "SPI1_SDO_PIN PA7" "$CONFIG"

          echo "Checking gyro CS PA4..."
          grep -q "GYRO_1_CS_PIN PA4" "$CONFIG"

          echo "Checking gyro EXTI PC4..."
          grep -q "GYRO_1_EXTI_PIN PC4" "$CONFIG"

          echo "Checking gyro SPI instance..."
          grep -q "GYRO_1_SPI_INSTANCE SPI1" "$CONFIG"

          echo "========================================"
          echo " SPEDIXF405 SPI1 CONFIG CHECK PASSED"
          echo "========================================"

      - name: Build SPEDIXF405
        run: |
          make CONFIG=SPEDIXF405

      - name: Inspect compiled SPI and gyro
        run: |
          echo "========================================"
          echo " ICM42688P"
          echo "========================================"
          grep -R -i "icm42688" obj/ || true

          echo "========================================"
          echo " SPI INIT"
          echo "========================================"
          grep -R -i "spiInit" obj/ || true

          echo "========================================"
          echo " SPI BUS"
          echo "========================================"
          grep -R -i "spiBus" obj/ || true

          echo "========================================"
          echo " SPI DEVICE"
          echo "========================================"
          grep -R -i "SPIDEV_1" obj/ || true

          echo "========================================"
          echo " TARGET CONFIG USED FOR BUILD"
          echo "========================================"
          grep -E \
          "USE_SPI_GYRO|USE_SPI_DEVICE_1|ICM42688P|GYRO_1|SPI1_" \
          src/config/configs/SPEDIXF405/config.h

      - name: Find build outputs
        run: |
          echo "Generated files:"
          find . -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.map" -o \
            -name "*.elf" \
          \) -print

      - name: Collect diagnostic files
        run: |
          mkdir -p firmware

          find . -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.map" -o \
            -name "*.elf" \
          \) \
          -not -path "./firmware/*" \
          -exec cp {} firmware/ \;

          echo "========================================"
          echo " ARTIFACT CONTENTS"
          echo "========================================"

          ls -lah firmware/

          test "$(find firmware -type f | wc -l)" -gt 0

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: SPEDIXF405-4.5.1-SPI1-FIX
          path: firmware/
          if-no-files-found: error
