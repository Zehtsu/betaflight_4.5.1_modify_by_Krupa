name: Build Betaflight 4.5.1 SPEDIXF405

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip curl unzip

      - name: Install ARM toolchain
        run: |
          make arm_sdk_install

      - name: Download target configs
        run: |
          make configs

      - name: Fix SPEDIXF405 config path for Betaflight 4.5.1
        run: |
          mkdir -p src/config/configs/SPEDIXF405
          cp -a src/config/configs/SPDX/SPEDIXF405/. src/config/configs/SPEDIXF405/

      - name: Check SPEDIXF405 config
        run: |
          echo "Checking SPEDIXF405 config..."
          ls -la src/config/configs/SPEDIXF405/
          test -f src/config/configs/SPEDIXF405/config.h

      - name: Build SPEDIXF405
        run: |
          make CONFIG=SPEDIXF405

      - name: Find firmware
        run: |
          echo "Generated firmware files:"
          find . -type f \( -name "*.hex" -o -name "*.bin" \) -print

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find . -type f \( -name "*.hex" -o -name "*.bin" \) \
            -not -path "./firmware/*" \
            -exec cp {} firmware/ \;
          ls -lah firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Betaflight-4.5.1-SPEDIXF405-Custom
          path: firmware/
          if-no-files-found: error
