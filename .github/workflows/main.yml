name: Inspect SPEDIXF405 Config

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Betaflight
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip curl unzip

      - name: Download Betaflight configs
        run: |
          make configs

      - name: Show config repository revision
        run: |
          echo "===== CONFIG REPOSITORY ====="
          cd src/config

          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current || true

          echo "Latest commit:"
          git log -1 --oneline

      - name: Find SPEDIXF405
        run: |
          echo "===== SEARCHING FOR SPEDIXF405 ====="

          find src/config -iname "*SPEDIXF405*" -print

          echo ""
          echo "===== DIRECTORY CONTENTS ====="

          find src/config/configs -type d -name "SPEDIXF405" \
            -exec sh -c 'echo "--- {} ---"; ls -lah "{}"' \;

      - name: Show SPEDIXF405 config.h
        run: |
          CONFIG=$(find src/config/configs \
            -type f \
            -path "*/SPEDIXF405/config.h" \
            | head -n 1)

          echo "config.h path:"
          echo "$CONFIG"

          if [ -z "$CONFIG" ]; then
            echo "ERROR: SPEDIXF405 config.h NOT FOUND"
            exit 1
          fi

          echo ""
          echo "===== FULL config.h ====="
          cat "$CONFIG"

      - name: Check config.c
        run: |
          CONFIG_C=$(find src/config/configs \
            -type f \
            -path "*/SPEDIXF405/config.c" \
            | head -n 1)

          echo "===== CONFIG.C CHECK ====="

          if [ -z "$CONFIG_C" ]; then
            echo "SPEDIXF405 config.c DOES NOT EXIST"
          else
            echo "config.c found:"
            echo "$CONFIG_C"

            echo ""
            echo "===== FULL config.c ====="
            cat "$CONFIG_C"
          fi

      - name: Show SPI and gyro definitions
        run: |
          CONFIG=$(find src/config/configs \
            -type f \
            -path "*/SPEDIXF405/config.h" \
            | head -n 1)

          echo "===== SPI / GYRO DEFINES ====="

          grep -n -E \
          "USE_SPI|SPI1_|GYRO_1|ICM42688|MPU6000|BMI270|DPS310" \
          "$CONFIG" || true
